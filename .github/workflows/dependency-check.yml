name: Revisar actualizaciones

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Build de React
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm.cmd ci
        shell: pwsh
        env:
          HUSKY: 0

      - name: Revisar tipos y compilar
        run: npm.cmd run build
        shell: pwsh

  assistant-backend:
    name: Revisar servicio Python
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r assistant_backend/requirements.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q assistant_backend
